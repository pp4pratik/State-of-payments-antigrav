      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // GitHub Pages SPA routing trick.
      // GitHub Pages serves 404.html for any path it can't find; 404.html encodes
      // the original path as ?p= and redirects here. Restore it before the router boots.
      (function () {
        var params = new URLSearchParams(window.location.search)
        var redirect = params.get('p')
        if (redirect) {
          window.history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
