    <script>
      // GitHub Pages SPA routing trick.
      // GitHub Pages serves 404.html for any path it can't find; 404.html encodes
      // the original path as ?p= and redirects here. Restore it before the router boots.
      (function () {
        var params = new URLSearchParams(window.location.search)
        var redirect = params.get('p')
        if (redirect) {
          window.history.replaceState(null, '', redirect)
        }
      })()
